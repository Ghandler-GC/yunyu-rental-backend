server:
  port: 18080

spring:
  application:
    name: bite-gateway
  profiles:
    active: ${RUN_ENV}
  main:
    web-application-type: reactive
    allow-bean-definition-overriding: true
  # 公共模块中的全局异常处理器依赖 Servlet(MVC)，网关为 WebFlux 环境，不能注册
  autoconfigure:
    exclude: com.bitejiuyeke.bitecommonsecurity.handler.GlobalExceptionHandler
  cloud:
    nacos:
      discovery:
        username: nacos
        password: bite@123
        namespace: bitehouse-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
      config:
        username: nacos
        password: bite@123
        namespace: bitehouse-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
        file-extension: yaml
        # 共享配置
        shared-configs:
          - data-id: share-common-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true
          - data-id: share-redis-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
            refresh: true

logging:
  pattern:
    console: '[%thread] %-5level %logger{36} - %msg%n'
