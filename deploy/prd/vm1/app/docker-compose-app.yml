version: '3.8'
#启动命令 docker compose -p bitehouse -f docker-compose-mid.yml up -d
services:
  bitehouse-admin:
    build:
      context: service/admin
    image: bitehouseprd/bite-admin-service:1.0-SNAPSHOT
    container_name: bitehouse-admin-prd
    ports:
      - "18081:18081"
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器1内网ip/你的虚拟机1内网ip
    networks:
      bitehouse_network_prd:
  bitehouse-file:
    build:
      context: service/file
    ports:
      - "18082:18082"
    image: bitehouseprd/bite-file-service:1.0-SNAPSHOT
    container_name: bitehouse-file-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器1内网ip/你的虚拟机1内网ip
    networks:
      bitehouse_network_prd:
  bitehouse-gateway:
    build:
      context: service/gateway
    ports:
      - "18080:18080"
    image: bitehouseprd/bite-gateway-service:1.0-SNAPSHOT
    container_name: bitehouse-gateway-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器1内网ip/你的虚拟机1内网ip
    networks:
      bitehouse_network_prd:
  bitehouse-portal:
    build:
      context: service/portal
    ports:
      - "18083:18083"
    image: bitehouseprd/bite-portal-service:1.0-SNAPSHOT
    container_name: bitehouse-portal-prd
    environment:
      RUN_ENV: prd
      NACOS_ADDR: 你的云服务器1内网ip/你的虚拟机1内网ip:8854,你的云服务器1内网ip/你的虚拟机1内网ip:8856,你的云服务器2内网ip/你的虚拟机2内网ip:8858
      JAVA_OPTS: -Xmx256m -Dspring.cloud.nacos.discovery.ip=你的云服务器1内网ip/你的虚拟机1内网ip
    networks:
      bitehouse_network_prd:
networks:
  bitehouse_network_prd:
