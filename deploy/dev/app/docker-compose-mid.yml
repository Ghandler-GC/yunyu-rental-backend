version: '3.8'
#启动命令 docker compose -p bitehouse -f docker-compose-mid.yml up -d
services:
  bitehouse-mysql:
    container_name: bitehouse-mysql
    image: mysql:8.4.2
    ports:
      - "3306:3306"
    volumes:
      - ../data/bitehousedata/mysql/data:/var/lib/mysql
      - ./mysql/init/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/sql:/opt/sql
    command: [
      'mysqld',
      '--innodb-buffer-pool-size=80M',
      '--character-set-server=utf8mb4',
      '--collation-server=utf8mb4_unicode_ci',
      '--default-time-zone=+8:00',
      '--lower-case-table-names=1',
      '--explicit_defaults_for_timestamp=true',
      '--server-id=1',
      '--log-bin=mysql-bin',
      '--binlog-ignore-db=mysql',
      '--binlog-cache-size=256M',
      '--binlog-format=ROW',
      '--max_connections=2000'
    ]
    restart: always
    networks:
      - bitehouse_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-uroot", "-pbite@123"]
      start_period: 40s
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_PASSWORD=bite@123
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000

  bitehouse-nacos:
    container_name: bitehouse-nacos
    image: nacos/nacos-server:v2.2.2
    environment:
      - MODE=standalone
      - JVM_XMS=512m
      - JVM_XMX=512m
      - JVM_XMN=256m
      - TZ=Asia/Shanghai
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_SYSTEM_TYPE=nacos
      - NACOS_AUTH_TOKEN=SecretKey012345678901234567890123456789012345678901234567890123456789
      - NACOS_AUTH_IDENTITY_KEY=serverIdentity
      - NACOS_AUTH_IDENTITY_VALUE=security
    volumes:
      - ../data/bitehousedata/nacos/logs/:/home/nacos/logs
      - ../data/bitehousedata/nacos/tomcatlogs/:/home/bit/nacos/tomcat/logs/
      - ./nacos/conf/application.properties:/home/nacos/conf/application.properties
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    restart: always
    networks:
      - bitehouse_network
    depends_on:
      bitehouse-mysql:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8848/nacos" ]
      start_period: 45s
      interval: 10s
      timeout: 10s
      retries: 12

  bitehouse-redis:
    container_name: bitehouse-redis
    image: redis:7.0.15
    ports:
      - "6379:6379"
    volumes:
      - ./redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
      - ../data/bitehousedata/redis/data:/data
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: always
    networks:
      - bitehouse_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  bitehouse-rabbitmq:
    image: rabbitmq:3.12.6-management
    container_name: bitehouse-rabbitmq
    restart: always
    hostname: bitehouse-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=bite@123
      - TZ=Asia/Shanghai
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ../data/bitehousedata/rabbitmq/log:/var/log/rabbitmq
      - ../data/bitehousedata/rabbitmq/data:/var/lib/rabbitmq
    networks:
      - bitehouse_network
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 10s
      retries: 10

networks:
  bitehouse_network:
    driver: bridge
